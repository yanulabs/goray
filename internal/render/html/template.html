<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goray · Architecture Report</title>
<style>{{.CSS}}</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div class="brand-wrap">
      <span class="brand-mark" aria-hidden="true">G</span>
      <div class="brand-text">
        <div class="brand">goray</div>
        <div id="repo-meta" class="meta-line"></div>
      </div>
    </div>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Report views">
      <button type="button" class="tab active" data-tab="overview" role="tab" aria-selected="true">Overview</button>
      <button type="button" class="tab" data-tab="graph" role="tab" aria-selected="false">Dependencies</button>
      <button type="button" class="tab" data-tab="hotspots" role="tab" aria-selected="false">Hotspots</button>
      <button type="button" class="tab" data-tab="interfaces" role="tab" aria-selected="false">Interfaces</button>
      <button type="button" class="tab" data-tab="tree" role="tab" aria-selected="false">Hierarchy</button>
    </nav>

    <div class="topbar-actions">
      <div class="search-wrap">
        <input id="global-search" type="search" autocomplete="off" spellcheck="false" placeholder="Jump to symbol…" aria-label="Global symbol search" aria-controls="search-results" aria-expanded="false">
        <kbd class="kbd" aria-hidden="true">/</kbd>
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </div>
      <button type="button" class="icon-btn theme-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
  </div>
</header>

<main class="main">
  <section class="view active" data-view="overview">
    <div id="overview-content"></div>
  </section>

  <section class="view" data-view="graph">
    <div class="controls" id="graph-controls"></div>
    <div class="graph-wrap">
      <div class="graph-hud" id="graph-hud"></div>
      <div class="graph-zoom-tools" id="graph-zoom-tools"></div>
      <svg id="graph-svg" role="img" aria-label="Dependency graph"></svg>
      <div class="graph-legend" id="graph-legend">
        <span class="legend-item"><span class="swatch swatch-out"></span>Outgoing</span>
        <span class="legend-item"><span class="swatch swatch-in"></span>Incoming</span>
        <span class="legend-item"><span class="swatch swatch-cycle"></span>Back-edge</span>
        <span class="legend-hint">Scroll/pinch zoom · Drag pan · Click inspect · Dbl-click module drill-down</span>
      </div>
    </div>
  </section>

  <section class="view" data-view="hotspots">
    <div id="hotspot-controls" class="controls"></div>
    <div class="panel table-panel"><div id="hotspot-table"></div></div>
  </section>

  <section class="view" data-view="interfaces">
    <div class="controls" id="interface-controls">
      <input id="interface-search" type="search" placeholder="Filter interfaces or implementations…">
      <select id="interface-filter" aria-label="Filter interfaces by implementation count">
        <option value="all">All interfaces</option>
        <option value="implemented">Implemented</option>
        <option value="unimplemented">Unimplemented (0)</option>
      </select>
      <div class="spacer"></div>
      <span id="interface-count" class="muted count-label"></span>
    </div>
    <div id="interfaces-content"></div>
  </section>

  <section class="view" data-view="tree">
    <div class="controls" id="tree-controls">
      <input id="tree-search" type="search" placeholder="Filter hierarchy…">
      <button type="button" class="ghost" id="tree-expand">Expand all</button>
      <button type="button" class="ghost" id="tree-collapse">Collapse</button>
      <div class="spacer"></div>
      <span id="tree-count" class="muted count-label"></span>
    </div>
    <div id="tree-content" class="tree"></div>
  </section>
</main>

<div id="inspector-backdrop" class="inspector-backdrop" aria-hidden="true"></div>
<aside id="inspector" class="inspector" aria-label="Symbol inspector" aria-hidden="true" inert>
  <div class="inspector-head">
    <div class="inspector-nav">
      <button type="button" class="icon-btn" id="inspector-back" title="Back (Alt+Left)" aria-label="Previous symbol" disabled>&larr;</button>
      <button type="button" class="icon-btn" id="inspector-forward" title="Forward (Alt+Right)" aria-label="Next symbol" disabled>&rarr;</button>
    </div>
    <div class="inspector-title-wrap">
      <h2 id="inspector-title">Details</h2>
      <div id="inspector-subtitle" class="muted mono"></div>
    </div>
    <button type="button" class="close" id="inspector-close" title="Close (Esc)" aria-label="Close inspector">&times;</button>
  </div>
  <div id="inspector-body" class="inspector-body"></div>
</aside>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>This report requires JavaScript. All data is embedded locally.</noscript>
<script id="report-data" type="application/json">{{.ReportJSON}}</script>
<script>{{.JS}}</script>
</body>
</html>
