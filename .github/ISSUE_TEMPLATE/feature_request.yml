name: Feature request
description: Propose a capability, integration, or workflow improvement.
title: "feat: "
labels:
  - "type: enhancement"
  - "triage: needed"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked or unnecessarily expensive today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, tool, flag, or output you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, workarounds, or API shapes you evaluated.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - MCP server/tools
        - Indexing and analysis
        - Summary cache
        - Renderers and reports
        - Installers
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: This request is scoped to deterministic code intelligence or its integrations, not LLM-generated analysis.
          required: true
