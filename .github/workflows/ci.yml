name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify
        run: make verify
      - name: Build
        run: make build

  web:
    name: Web report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Check embedded report is current
        run: git diff --exit-code -- internal/render/dist/report.html

  cross-build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
      - name: Build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run govulncheck
        run: govulncheck ./...

  release-config:
    name: Validate GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
